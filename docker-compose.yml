services:
  nginx:
    image: nginx:latest
    container_name: my-site-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    image: python:3.12-slim
    container_name: my-site-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./app:/app
      - ./public:/app/public
      - ./data:/data
    command: sh -c "pip install flask werkzeug && python server.py"
