server {

    listen 80;

    server_name localhost;


    location /static/ {
        alias /usr/share/nginx/html/static/;
    }


    location /charts/ {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }


    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

}